<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Auth Wallet</title>
</head>
<body>
    <h1>Backend Status</h1>
    <div id="status">Checking connection...</div>

    <script>
        const API_URL = "https://phone-auth-wallet-backend.onrender.com";

        async function checkBackend() {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = 'Checking connection...';

            try {
                const response = await fetch(`${API_URL}/health`, {
                    method: 'GET',
                    mode: 'cors',
                    cache: 'no-store',
                });

                const text = await response.text();
                let data = null;

                try {
                    data = text ? JSON.parse(text) : null;
                } catch {
                    data = { raw: text };
                }

                if (!response.ok) {
                    throw new Error(
                        `HTTP ${response.status}: ${response.statusText}${data && data.message ? ` - ${data.message}` : ''}`
                    );
                }

                statusDiv.innerText = 'Success: ' + JSON.stringify(data ?? { status: 'ok' });
            } catch (error) {
                statusDiv.innerText = 'Error connecting to backend: ' + error.message;
            }
        }

        checkBackend();
    </script>
</body>
</html>
